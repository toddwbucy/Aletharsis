name: Backend validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Go ${{ matrix.go }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.0', '1.27.1']
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      PYTHONPATH: src
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: Record toolchain and verify oracle runtime
        run: |
          mkdir -p artifacts bin
          { go version; python --version; uname -sm; } | tee artifacts/environment.txt
          python - <<'PY'
          import platform, unicodedata
          assert platform.python_version() == '3.12.13'
          assert unicodedata.unidata_version == '15.0.0'
          PY
      - name: Install test-only Python dependencies
        run: |
          timeout 180s python -m pip install --disable-pip-version-check -r scripts/requirements-ci.txt
          timeout 180s python -m pip install --no-deps --no-build-isolation -e .
      - name: Check Go formatting
        run: |
          git ls-files -z '*.go' | xargs -0 gofmt -l | tee artifacts/gofmt.txt
          test ! -s artifacts/gofmt.txt
      - name: Verify modules and vet
        run: |
          timeout 180s go mod download
          go mod verify | tee artifacts/modules.txt
          timeout 180s go vet ./... 2>&1 | tee artifacts/vet.txt
          git diff --exit-code -- go.mod go.sum
      - name: Go tests and combined coverage
        run: timeout 300s go test -count=1 -timeout=2m -json -coverpkg=./internal/... -coverprofile=artifacts/coverage.out ./... | tee artifacts/go-tests.jsonl
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('artifacts/coverage.out') != '' }}
        run: go tool cover -func=artifacts/coverage.out | tee artifacts/coverage.txt
      - name: Go race tests
        run: timeout 300s go test -count=1 -race -timeout=2m -json ./... | tee artifacts/go-race.jsonl
      - name: Build executable
        run: timeout 180s go build -trimpath -o bin/aletharsis ./cmd/aletharsis
      - name: Retained Python and reference-tool tests
        run: timeout 180s python -m pytest -q --junitxml=artifacts/python-tests.xml 2>&1 | tee artifacts/python-tests.txt
      - name: Frozen report parity and deterministic output
        run: timeout 180s python scripts/check_parity.py bin/aletharsis 2>&1 | tee artifacts/frozen-parity.txt
      - name: Live seeded Python comparison
        run: timeout 180s python scripts/check_differential.py bin/aletharsis 2>&1 | tee artifacts/differential.txt
      - name: Verify frozen artifacts were not rewritten
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- reference/python-behavior src/aletharsis tests/fixtures pyproject.toml
      - name: Retain validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-go-${{ matrix.go }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
