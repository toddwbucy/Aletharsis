name: Bounded fuzzing

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fuzz.yml'
      - 'internal/**/*fuzz*'
      - 'internal/audit/**'
      - 'internal/capability/**'
      - 'internal/evidence/v2/**'
      - 'internal/identity/**'
      - 'internal/wire/**'
      - 'schemas/**'
      - 'internal/**/testdata/fuzz/**'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: parsers
            target: FuzzDecodeCoordinates
          - package: unicoderef
            target: FuzzNormalization
          - package: analyzers
            target: FuzzAnalyzerEvidence
          - package: reporters
            target: FuzzJSONEvidence
          - package: audit
            target: FuzzNativeV2
    env:
      GOTOOLCHAIN: local
      FUZZ_TIME: ${{ github.event_name == 'pull_request' && '10s' || '60s' }}
      FUZZ_PACKAGE: ${{ matrix.package }}
      FUZZ_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Record reproduction context
        run: |
          mkdir -p artifacts
          printf 'GOCACHE=%s/aletharsis-fuzz-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          { go version; git rev-parse HEAD; uname -sm; } | tee artifacts/environment.txt
          printf 'target=%s package=%s fuzztime=%s parallel=2 input_limit=4096\n' "$FUZZ_TARGET" "$FUZZ_PACKAGE" "$FUZZ_TIME" | tee artifacts/parameters.txt
      - name: Search within a fixed budget
        run: |
          timeout 240s go test "./internal/$FUZZ_PACKAGE" -run='^$' \
            -fuzz="^${FUZZ_TARGET}$" -fuzztime="$FUZZ_TIME" \
            -fuzzminimizetime=10s -parallel=2 -timeout=3m \
            2>&1 | tee artifacts/fuzz.txt
      - name: Retain logs and discovered inputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            artifacts/
            internal/**/testdata/fuzz/**
            ${{ runner.temp }}/aletharsis-fuzz-cache/fuzz/**
          if-no-files-found: warn
          retention-days: 14
